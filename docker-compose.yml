version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
      - .env.${APP_ENV}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    working_dir: /workspace/app
    command: sh -c "alembic -c /workspace/app/alembic.ini upgrade head && python app.py"
    volumes:
      - ./app:/workspace/app
      - ./alembic.ini:/workspace/app/alembic.ini:ro
      - ./migrations:/workspace/app/migrations:rw
    env_file:
      - .env
      - .env.${APP_ENV}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: python:3.11-slim
    working_dir: /workspace/worker
    command: sh -c "sleep infinity"
    volumes:
      - ./worker:/workspace/worker
    env_file:
      - .env
      - .env.${APP_ENV}
    depends_on:
      postgres:
        condition: service_healthy

  notifier:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  db-seed:
    image: postgres:16-alpine
    profiles: ["tools"]
    env_file:
      - .env
      - .env.${APP_ENV}
    volumes:
      - ./db/seed:/seed:ro
    entrypoint: ["sh", "-c", "psql ${DATABASE_URL} -f /seed/seed.sql"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
